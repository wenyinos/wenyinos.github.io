name: Sync GitHub Pages to CloudBase

# 这个仓库是站点构建产物，也是 CloudBase 镜像的同步源。
# 注意：不要在源码仓库再用 `hexo deploy` 强制推送本仓库，否则会清空本工作流。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-wenyinos-wiki
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Pages content
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare deploy directory
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.7

      - name: Login to CloudBase
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_API_KEY: ${{ secrets.TCB_API_KEY }}
        run: |
          set -euo pipefail
          : "${TCB_ENV_ID:?Missing TCB_ENV_ID repository secret}"
          : "${TCB_API_KEY:?Missing TCB_API_KEY repository secret}"
          tcb login --cloudbase-api-key "$TCB_API_KEY" -e "$TCB_ENV_ID"

      - name: Deploy Pages content to CloudBase
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          tcb app deploy wenyinos-wiki \
            -e "$TCB_ENV_ID" \
            --cwd dist \
            --framework static \
            --install-command "" \
            --build-command "" \
            --output-dir ./ \
            --deploy-path / \
            --force \
            --json
